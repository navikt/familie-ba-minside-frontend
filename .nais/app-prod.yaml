apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: familie-ba-minside-frontend
  namespace: teamfamilie
  labels:
    team: teamfamilie
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '25M'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '120'
spec:
  envFrom:
    - secret: familie-ba-minside-frontend-unleash-api-token
  image: {{ image }}
  replicas:
    min: 2
    max: 3
    cpuThresholdPercentage: 50
  port: 9000
  liveness:
    path: /barnetrygd/min-barnetrygd/api/internal/isAlive
    initialDelay: 5
  readiness:
    path: /barnetrygd/min-barnetrygd/api/internal/isReady
    initialDelay: 5
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: false
      runtime: nodejs
  prometheus:
    enabled: true
    path: /barnetrygd/min-barnetrygd/api/internal/metrics
  ingresses:
    - https://www.ansatt.nav.no/barnetrygd/min-barnetrygd
    - https://www.ansatt.nav.no/utvidetbarnetrygd/min-barnetrygd
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
      external:
        - host: teamfamilie-unleash-api.nav.cloud.nais.io
        - host: familie-integrasjoner.prod-fss-pub.nais.io
  resources:
    limits:
      cpu: 2000m
      memory: 1024Mi
    requests:
      memory: 512Mi
  idporten:
    enabled: true
    sidecar:
      enabled: true
      autoLogin: true
      level: Level4
      autoLoginIgnorePaths:
        - /barnetrygd/min-barnetrygd/**/*.css
        - /barnetrygd/min-barnetrygd/**/manifest.json
  tokenx:
    enabled: true
  secureLogs:
  env:
    - name: ENV
      value: prod